<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Administrador - Rifa 507</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 15px;

            background: #080808;
            color: white;

            font-family: Arial, Helvetica, sans-serif;

            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
        }

        .subtitulo {
            color: #ccc;
            margin-bottom: 25px;
        }

        .login {
            width: 100%;
            max-width: 380px;

            margin: 40px auto;

            padding: 25px;

            background: #151515;

            border: 1px solid #b93cff;
            border-radius: 12px;
        }

        .login input {
            width: 100%;

            padding: 12px;

            margin-bottom: 12px;

            border-radius: 7px;
            border: 1px solid #555;

            font-size: 15px;
        }

        button {
            cursor: pointer;
        }

        #loginBtn {
            width: 100%;

            padding: 12px;

            background: #b93cff;
            color: white;

            border: none;
            border-radius: 7px;

            font-size: 15px;
            font-weight: bold;
        }

        #loginBtn:hover {
            opacity: 0.85;
        }

        #mensaje {
            margin-top: 15px;
            min-height: 20px;
        }

        #panelAdmin {
            display: none;

            width: 100%;
            max-width: 750px;

            margin: auto;
        }

        .barra-admin {
            display: flex;
            justify-content: space-between;
            align-items: center;

            gap: 10px;

            margin-bottom: 20px;

            padding: 12px;

            background: #151515;

            border-radius: 10px;
        }

        #cerrarSesion {
            padding: 9px 14px;

            border: 1px solid #b93cff;
            border-radius: 7px;

            color: white;
            background: transparent;
        }

        .numeros-admin {
            display: grid;

            grid-template-columns: repeat(10, 1fr);

            gap: 7px;
        }

        .numero-admin {
            aspect-ratio: 1 / 1;

            display: flex;
            align-items: center;
            justify-content: center;

            border: 1px solid #aaa;
            border-radius: 6px;

            background: white;
            color: black;

            font-size: 17px;
            font-weight: bold;

            cursor: pointer;
        }

        .numero-admin:hover {
            transform: scale(1.05);
        }

        .numero-admin.ocupado {
            background: rgb(190, 55, 255);
            color: white;

            border-color: #d597ff;
        }

        .leyenda {
            margin: 20px 0;

            display: flex;
            justify-content: center;

            gap: 25px;
        }

        .estado {
            display: flex;
            align-items: center;

            gap: 7px;
        }

        .color {
            width: 18px;
            height: 18px;

            border-radius: 4px;
        }

        .color.disponible {
            background: white;
        }

        .color.ocupado {
            background: rgb(190, 55, 255);
        }

        @media (max-width: 600px) {

            .numeros-admin {
                grid-template-columns: repeat(5, 1fr);
            }

        }
    </style>
</head>

<body>

    <h1>Administrador Rifa 507</h1>


    <!-- INICIO DE SESIÓN -->
    <div
        class="login"
        id="loginBox"
    >

        <h2>Iniciar sesión</h2>

        <input
            type="email"
            id="correo"
            placeholder="Correo electrónico"
        >

        <input
            type="password"
            id="password"
            placeholder="Contraseña"
        >

        <button id="loginBtn">
            Entrar
        </button>

        <div id="mensaje"></div>

    </div>


    <!-- PANEL ADMINISTRADOR -->
    <div id="panelAdmin">

        <div class="barra-admin">

            <strong>
                Panel de números
            </strong>

            <button id="cerrarSesion">
                Cerrar sesión
            </button>

        </div>


        <p class="subtitulo">
            Haz clic en un número para cambiar entre disponible y ocupado.
        </p>


        <div class="leyenda">

            <div class="estado">

                <span class="color disponible"></span>

                Disponible

            </div>


            <div class="estado">

                <span class="color ocupado"></span>

                Ocupado

            </div>

        </div>


        <div
            class="numeros-admin"
            id="numerosAdmin">
        </div>

    </div>


    <script
        type="module"
        src="admin.js">
    </script>

</body>

</html>

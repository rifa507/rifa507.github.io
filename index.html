<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Gran Rifa de Cartera</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="pagina">

        <div class="rifa-container">

            <!-- IMAGEN ORIGINAL DE LA RIFA -->
            <img
                src="rifa.jpeg"
                alt="Gran Rifa de Cartera"
                class="rifa-imagen"
            >

            <!-- CUADRÍCULA INVISIBLE ENCIMA DE LOS NÚMEROS -->
            <div
                class="numeros-grid"
                id="numbersContainer">
            </div>

        </div>


        <!-- LEYENDA -->
        <div class="panel">

            <div class="estado">
                <span class="cuadro disponible"></span>
                Disponible
            </div>

            <div class="estado">
                <span class="cuadro ocupado"></span>
                Ocupado
            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Administrador - Rifa 507</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 15px;

            background: #080808;
            color: white;

            font-family: Arial, Helvetica, sans-serif;

            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
        }

        .subtitulo {
            color: #ccc;
            margin-bottom: 25px;
        }

        button {
            cursor: pointer;
        }

        /* ===================================== */
        /* LOGIN */
        /* ===================================== */

        .login {
            width: 100%;
            max-width: 380px;

            margin: 40px auto;

            padding: 25px;

            background: #151515;

            border: 1px solid #b93cff;
            border-radius: 12px;
        }

        .login input {
            width: 100%;

            padding: 12px;

            margin-bottom: 12px;

            border-radius: 7px;
            border: 1px solid #555;

            font-size: 15px;
        }

        #loginBtn {
            width: 100%;

            padding: 12px;

            background: #b93cff;
            color: white;

            border: none;
            border-radius: 7px;

            font-size: 15px;
            font-weight: bold;
        }

        #loginBtn:hover {
            opacity: 0.85;
        }

        #mensaje {
            margin-top: 15px;
            min-height: 20px;
        }

        /* ===================================== */
        /* PANEL ADMIN */
        /* ===================================== */

        #panelAdmin {
            display: none;

            width: 100%;
            max-width: 850px;

            margin: auto;
        }

        .barra-admin {
            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 10px;

            margin-bottom: 20px;

            padding: 12px;

            background: #151515;

            border-radius: 10px;
        }

        #cerrarSesion {
            padding: 9px 14px;

            border: 1px solid #b93cff;

            border-radius: 7px;

            color: white;

            background: transparent;
        }

        /* ===================================== */
        /* LEYENDA */
        /* ===================================== */

        .leyenda {
            margin: 20px 0;

            display: flex;

            justify-content: center;

            flex-wrap: wrap;

            gap: 25px;
        }

        .estado {
            display: flex;

            align-items: center;

            gap: 7px;
        }

        .color {
            width: 18px;
            height: 18px;

            border-radius: 4px;
        }

        .color.disponible {
            background: white;
        }

        .color.ocupado {
            background: rgb(190, 55, 255);
        }

        .color.pagado {
            background: rgb(32, 190, 95);
        }

        /* ===================================== */
        /* CUADRÍCULA */
        /* ===================================== */

        .numeros-admin {
            display: grid;

            grid-template-columns: repeat(10, 1fr);

            gap: 8px;
        }

        .numero-item {
            min-width: 0;
        }

        .numero-admin {
            width: 100%;

            aspect-ratio: 1 / 1;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            gap: 4px;

            padding: 5px;

            border: 1px solid #aaa;

            border-radius: 6px;

            background: white;

            color: black;

            transition:
                transform 0.15s,
                background 0.2s;

            overflow: hidden;
        }

        .numero-admin:hover {
            transform: scale(1.05);
        }

        .numero-admin.ocupado {
            background: rgb(190, 55, 255);

            color: white;

            border-color: #d597ff;
        }

        .numero-admin.pagado {
            background: rgb(32, 190, 95);

            color: white;

            border-color: rgb(94, 230, 145);
        }

        .numero-texto {
            font-size: 17px;

            font-weight: bold;

            line-height: 1;
        }

        .nombre-cliente {
            display: block;

            width: 95%;

            min-height: 12px;

            color: white;

            font-size: 10px;

            font-weight: bold;

            line-height: 1.1;

            text-align: center;

            overflow: hidden;

            text-overflow: ellipsis;

            white-space: nowrap;
        }

        /* ===================================== */
        /* MODAL */
        /* ===================================== */

        .modal-fondo {
            display: none;

            position: fixed;

            z-index: 9999;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            padding: 20px;

            background: rgba(0, 0, 0, 0.78);

            align-items: center;

            justify-content: center;
        }

        .modal-fondo.activo {
            display: flex;
        }

        .modal {
            width: 100%;

            max-width: 430px;

            padding: 25px;

            background: #171717;

            border: 1px solid #b93cff;

            border-radius: 14px;

            box-shadow:
                0 0 30px rgba(185, 60, 255, 0.25);
        }

        .modal h2 {
            margin-top: 0;
        }

        .modal p {
            line-height: 1.5;

            color: #ddd;
        }

        .numero-modal {
            color: #c13cff;

            font-size: 28px;

            font-weight: bold;
        }

        .nombre-modal {
            color: white;

            font-weight: bold;
        }

        .botones-modal {
            display: flex;

            flex-direction: column;

            gap: 10px;

            margin-top: 20px;
        }

        .botones-modal button {
            width: 100%;

            padding: 11px 18px;

            border-radius: 7px;

            font-size: 14px;

            font-weight: bold;
        }

        .btn-si {
            background: #b93cff;

            color: white;

            border: 1px solid #b93cff;
        }

        .btn-pagado {
            background: rgb(32, 190, 95);

            color: white;

            border: 1px solid rgb(32, 190, 95);
        }

        .btn-desocupar {
            background: #c0392b;

            color: white;

            border: 1px solid #c0392b;
        }

        .btn-cancelar {
            background: transparent;

            color: white;

            border: 1px solid #777;
        }

        /* ===================================== */
        /* PEDIR NOMBRE */
        /* ===================================== */

        #pasoNombre,
        #pasoOcupado,
        #pasoPagado {
            display: none;
        }

        #nombreCliente {
            width: 100%;

            margin-top: 12px;

            padding: 12px;

            border: 1px solid #666;

            border-radius: 7px;

            font-size: 16px;
        }

        #errorNombre {
            min-height: 18px;

            margin-top: 8px;

            color: #ff8080;

            font-size: 13px;
        }

        /* ===================================== */
        /* CELULAR */
        /* ===================================== */

        @media (max-width: 600px) {

            body {
                padding: 20px 10px;
            }

            .numeros-admin {
                grid-template-columns: repeat(5, 1fr);
            }

            .nombre-cliente {
                font-size: 9px;
            }

        }

    </style>
</head>

<body>

    <h1>Administrador Rifa 507</h1>


    <!-- LOGIN -->

    <div
        class="login"
        id="loginBox"
    >

        <h2>Iniciar sesión</h2>

        <input
            type="email"
            id="correo"
            placeholder="Correo electrónico"
        >

        <input
            type="password"
            id="password"
            placeholder="Contraseña"
        >

        <button id="loginBtn">
            Entrar
        </button>

        <div id="mensaje"></div>

    </div>


    <!-- PANEL ADMIN -->

    <div id="panelAdmin">

        <div class="barra-admin">

            <strong>
                Panel de números
            </strong>

            <button id="cerrarSesion">
                Cerrar sesión
            </button>

        </div>

        <p class="subtitulo">
            Selecciona un número para cambiar su estado.
        </p>

        <div class="leyenda">

            <div class="estado">
                <span class="color disponible"></span>
                Disponible
            </div>

            <div class="estado">
                <span class="color ocupado"></span>
                Ocupado
            </div>

            <div class="estado">
                <span class="color pagado"></span>
                Pagado
            </div>

        </div>

        <div
            class="numeros-admin"
            id="numerosAdmin"
        ></div>

    </div>


    <!-- MODAL -->

    <div
        class="modal-fondo"
        id="modalFondo"
    >

        <div class="modal">


            <!-- DISPONIBLE -->

            <div id="pasoDisponible">

                <h2>Confirmar</h2>

                <p id="textoDisponible"></p>

                <div class="botones-modal">

                    <button
                        class="btn-si"
                        id="ocuparSi"
                    >
                        Sí, ocupar
                    </button>

                    <button
                        class="btn-cancelar"
                        id="cancelarDisponible"
                    >
                        Cancelar
                    </button>

                </div>

            </div>


            <!-- NOMBRE -->

            <div id="pasoNombre">

                <h2>
                    Nombre de la persona
                </h2>

                <p>
                    ¿Quién ocupará el número
                    <span
                        class="numero-modal"
                        id="numeroNombre"
                    ></span>?
                </p>

                <input
                    type="text"
                    id="nombreCliente"
                    placeholder="Ejemplo: Kevin"
                    maxlength="50"
                >

                <div id="errorNombre"></div>

                <div class="botones-modal">

                    <button
                        class="btn-si"
                        id="guardarNombre"
                    >
                        Guardar
                    </button>

                    <button
                        class="btn-cancelar"
                        id="cancelarNombre"
                    >
                        Cancelar
                    </button>

                </div>

            </div>


            <!-- OCUPADO -->

            <div id="pasoOcupado">

                <h2>Número ocupado</h2>

                <p id="textoOcupado"></p>

                <div class="botones-modal">

                    <button
                        class="btn-pagado"
                        id="marcarPagado"
                    >
                        Marcar PAGADO
                    </button>

                    <button
                        class="btn-desocupar"
                        id="desocuparOcupado"
                    >
                        DESOCUPAR
                    </button>

                    <button
                        class="btn-cancelar"
                        id="cancelarOcupado"
                    >
                        Cancelar
                    </button>

                </div>

            </div>


            <!-- PAGADO -->

            <div id="pasoPagado">

                <h2>Número pagado</h2>

                <p id="textoPagado"></p>

                <div class="botones-modal">

                    <button
                        class="btn-si"
                        id="volverOcupado"
                    >
                        Volver a OCUPADO
                    </button>

                    <button
                        class="btn-desocupar"
                        id="desocuparPagado"
                    >
                        DESOCUPAR
                    </button>

                    <button
                        class="btn-cancelar"
                        id="cancelarPagado"
                    >
                        Cancelar
                    </button>

                </div>

            </div>


        </div>

    </div>


    <script
        type="module"
        src="admin.js"
    ></script>

</body>

</html>

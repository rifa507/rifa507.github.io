<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Gran Rifa de Cartera</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="pagina">

        <!-- RIFA -->
        <div class="rifa-container">

            <!-- IMAGEN ORIGINAL -->
            <img
                src="img/rifa.jpeg"
                alt="Gran Rifa de Cartera"
                class="rifa-imagen"
            >

            <!-- CUADRÍCULA INVISIBLE SOBRE LOS NÚMEROS -->
            <div
                class="numeros-grid"
                id="numbersContainer">
            </div>

        </div>


        <!-- PANEL DE INFORMACIÓN -->
        <div class="panel">

            <div class="estado">
                <span class="cuadro disponible"></span>
                Disponible
            </div>

            <div class="estado">
                <span class="cuadro apartado"></span>
                Apartado
            </div>

            <div class="estado">
                <span class="cuadro pagado"></span>
                Pagado
            </div>

        </div>


        <!-- BOTONES -->
        <div class="acciones">

            <button id="reiniciar">
                Reiniciar números
            </button>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
